# ✅ Service Name (must match what gateway & eureka use)
spring.application.name=loan-service

# ✅ Server Port (different from identity-service)
server.port=8082

# ✅ MySQL Database (use SAME DB or separate DB based on design)
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_bank
spring.datasource.username=root
spring.datasource.password=21131a0508
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ✅ Eureka Client (VERY IMPORTANT)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Optional (nice for debugging)
eureka.instance.hostname=localhost

# ✅ Logging (optional but useful)
logging.level.org.springframework=INFO
logging.level.com.nexusbank=DEBUG