# ==============================
# SERVER
# ==============================
server.port=9000
spring.application.name=api-gateway

# ==============================
# EUREKA CONFIG
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ==============================
# GATEWAY ROUTES WITH CENTRAL AUTH FILTER
# ==============================

# ------------------------------
# Identity Service
# ------------------------------
spring.cloud.gateway.routes[0].id=identity-service
spring.cloud.gateway.routes[0].uri=lb://identity-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# ------------------------------
# Banking Service
# ------------------------------
spring.cloud.gateway.routes[1].id=banking-service
spring.cloud.gateway.routes[1].uri=lb://banking-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/accounts/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# ------------------------------
# Loan Service
# ------------------------------
spring.cloud.gateway.routes[2].id=loan-service
spring.cloud.gateway.routes[2].uri=lb://loan-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/loans/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# ==============================
# SWAGGER AGGREGATION ROUTES
# ==============================

# ------------------------------
# Identity Swagger Docs
# ------------------------------
spring.cloud.gateway.routes[3].id=identity-swagger
spring.cloud.gateway.routes[3].uri=lb://identity-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/identity-service/v3/api-docs
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/identity-service/(?<segment>.*), /$$\\{segment}

# ------------------------------
# Banking Swagger Docs
# ------------------------------
spring.cloud.gateway.routes[4].id=banking-swagger
spring.cloud.gateway.routes[4].uri=lb://banking-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/banking-service/v3/api-docs
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/banking-service/(?<segment>.*), /$$\\{segment}

# ------------------------------
# Loan Swagger Docs
# ------------------------------
spring.cloud.gateway.routes[5].id=loan-swagger
spring.cloud.gateway.routes[5].uri=lb://loan-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/loan-service/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/loan-service/(?<segment>.*), /$$\\{segment}

# ==============================
# DISCOVERY LOCATOR
# ==============================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ==============================
# SWAGGER UI AGGREGATION
# ==============================
springdoc.swagger-ui.urls[0].name=Identity Service
springdoc.swagger-ui.urls[0].url=/identity-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Banking Service
springdoc.swagger-ui.urls[1].url=/banking-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Loan Service
springdoc.swagger-ui.urls[2].url=/loan-service/v3/api-docs

# ==============================
# OPTIONAL SWAGGER SETTINGS
# ==============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================
# DEBUG LOGGING
# ==============================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# ==============================
# JWT TOKENS SECRET KEY
# ==============================
nexusbank.jwt.secret=NexusBankSuperSecretSigningKey2026SecureString